# Install only AFTER a valid certificate exists. Replace every cms.example.com.
# /etc/nginx/sites-enabled/* is included inside http {} on Ubuntu's Nginx.
limit_req_zone $binary_remote_addr zone=khfwcms_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name cms.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://cms.example.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cms.example.com;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/cms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:KHFWCMS_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    charset utf-8;
    client_max_body_size 5m;
    client_body_timeout 20s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/khfwcms.access.log;
    error_log /var/log/nginx/khfwcms.error.log warn;
    limit_req_status 429;
    error_page 429 = @khfwcms_rate_limited;

    location = /api/admin/login {
        client_max_body_size 8k;
        limit_req zone=khfwcms_login burst=5 nodelay;
        include /etc/nginx/snippets/khfwcms-proxy.conf;
    }
    location = /api/admin/password {
        client_max_body_size 8k;
        limit_req zone=khfwcms_login burst=5 nodelay;
        include /etc/nginx/snippets/khfwcms-proxy.conf;
    }
    location @khfwcms_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        return 429 '{"error":"请求过于频繁，请稍后再试"}';
    }
    location / {
        include /etc/nginx/snippets/khfwcms-proxy.conf;
    }
}
