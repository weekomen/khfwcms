# Include inside each proxying location. Replace cms.example.com.
proxy_pass http://127.0.0.1:3000;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host cms.example.com;
proxy_set_header X-Forwarded-Host cms.example.com;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header Forwarded "";
# Overwrite client-supplied headers. Application limits use the socket IP, not XFF.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_hide_header Strict-Transport-Security;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 35s;
proxy_request_buffering on;
