# Include only inside the kehoubang.cn HTTPS server's proxying locations.
# Never proxy the independent khb.kehoubang.cn business system to this service.
proxy_pass http://127.0.0.1:3000;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host kehoubang.cn;
proxy_set_header X-Forwarded-Host kehoubang.cn;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Port 443;
proxy_set_header Forwarded "";
# Preserve the browser's Origin and Cookie; never rewrite Origin to bypass CSRF.
# Overwrite client-supplied headers. Application limits use the socket IP, not XFF.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_hide_header Strict-Transport-Security;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 35s;
proxy_request_buffering on;
