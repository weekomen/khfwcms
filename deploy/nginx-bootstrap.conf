# Website only. Install while obtaining the first certificate.
# The independent khb.kehoubang.cn application has separate hosting/certificates.
# This file belongs in /etc/nginx/sites-available/khfwcms (included in http {}).
server {
    listen 80;
    listen [::]:80;
    server_name kehoubang.cn www.kehoubang.cn;
    server_tokens off;
    if ($host !~ "^(www\.)?kehoubang\.cn$") { return 444; }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Never offer the admin form or proxy its password requests over HTTP.
    location / {
        default_type text/plain;
        return 503 "HTTPS setup in progress\n";
    }
}
