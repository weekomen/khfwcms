# Install ONLY while obtaining the first certificate. Replace cms.example.com.
# This file belongs in /etc/nginx/sites-available/khfwcms (included in http {}).
server {
    listen 80;
    listen [::]:80;
    server_name cms.example.com;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Never offer the admin form or proxy its password requests over HTTP.
    location / {
        default_type text/plain;
        return 503 "HTTPS setup in progress\n";
    }
}
